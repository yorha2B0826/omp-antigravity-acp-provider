name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22.19.0", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run check
      - run: npm run pack:check
      - run: npm run test:packed
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit all dependencies (informational)
        # Dev-only tree: the host @oh-my-pi/* devDependency pins puppeteer-core →
        # chromium-bidi → zod 3.x, and zod's fix only exists on 4.6.6+, which
        # chromium-bidi's `^3.24.1` range cannot take. Not shipped, so it must not
        # block the release; kept visible here instead.
        continue-on-error: true
        run: npm audit --audit-level=moderate

  report-dispatched-results:
    name: Report dispatched CI results
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository_owner == 'zacbemis' && always() }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Report actual validation jobs on the exact tested head
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/report-dispatched-ci.mjs
